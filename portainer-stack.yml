      retries: 5

  analytics-service-container:
    image: toandeptroai/analytics-service:0.1.0
    container_name: analytics-service-container
    ports:
      - "8092:8092"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://31.220.87.43:5432/techhub}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - EUREKA_SERVER_URL=${EUREKA_SERVER_URL:-http://service-discovery-container:8761/eureka/}
      - EUREKA_INSTANCE_HOSTNAME=${EUREKA_INSTANCE_HOSTNAME_ANALYTICS_SERVICE:-analytics-service-container}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_CONSUMER_AUTO_STARTUP=${KAFKA_CONSUMER_AUTO_STARTUP:-true}
      - SPRING_KAFKA_LISTENER_AUTO_STARTUP=${SPRING_KAFKA_LISTENER_AUTO_STARTUP:-true}
      - ANALYTICS_REVENUE_GROUP=${ANALYTICS_REVENUE_GROUP:-analytics-revenue-group}
      - PAYMENT_EVENTS_TOPIC=${PAYMENT_EVENTS_TOPIC:-payment.revenue.events}
      - SPRING_ZIPKIN_BASE_URL=${SPRING_ZIPKIN_BASE_URL}
      - HOST_IP_ADDRESS=${HOST_IP_ADDRESS}
    networks:
      - techhub
    depends_on:
      - service-discovery-container
    cpus: "0.30"
    mem_limit: 512m
    mem_reservation: 256m
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8092/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  techhub:
    external: true

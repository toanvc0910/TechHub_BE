version: "3"
services:
  service-discovery-container:
    build:
      context: ./service-discovery
      dockerfile: Dockerfile
    image: toandeptroai/service-discovery:0.1.0
    container_name: service-discovery-container
    ports:
      - 8761:8761
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    networks:
      - do-an-net
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  api-gateway-container:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    image: toandeptroai/api-gateway:0.1.0
    container_name: api-gateway-container
    ports:
      - 8443:8443
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    networks:
      - do-an-net
    depends_on:
      service-discovery-container:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8443/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  proxy-client-container:
    build:
      context: ./proxy-client
      dockerfile: Dockerfile
    image: toandeptroai/proxy-client:0.1.0
    container_name: proxy-client-container
    ports:
      - 8085:8085
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    networks:
      - do-an-net
    depends_on:
      api-gateway-container:
        condition: service_healthy
    restart: always

  user-service-container:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    image: toandeptroai/user-service:0.1.0
    container_name: user-service-container
    ports:
      - 8080:8080
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    networks:
      - do-an-net
    depends_on:
      service-discovery-container:
        condition: service_healthy
    restart: always

  blog-service-container:
    build:
      context: ./blog-service
      dockerfile: Dockerfile
    image: toandeptroai/blog-service:0.1.0
    container_name: blog-service-container
    ports:
      - 8081:8081
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    networks:
      - do-an-net
    depends_on:
      api-gateway-container:
        condition: service_healthy
    restart: always

  course-service-container:
    build:
      context: ./course-service
      dockerfile: Dockerfile
    image: toandeptroai/course-service:0.1.0
    container_name: course-service-container
    ports:
      - 8082:8082
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    networks:
      - do-an-net
    depends_on:
      api-gateway-container:
        condition: service_healthy
    restart: always

  learning-path-service-container:
    build:
      context: ./learning-path-service
      dockerfile: Dockerfile
    image: toandeptroai/learning-path-service:0.1.0
    container_name: learning-path-service-container
    ports:
      - 8083:8083
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    networks:
      - do-an-net
    depends_on:
      api-gateway-container:
        condition: service_healthy
    restart: always

  payment-service-container:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    image: toandeptroai/payment-service:0.1.0
    container_name: payment-service-container
    ports:
      - 8084:8084
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    networks:
      - do-an-net
    depends_on:
      api-gateway-container:
        condition: service_healthy
    restart: always

  file-service-container:
    build:
      context: ./file-service
      dockerfile: Dockerfile
    image: toandeptroai/file-service:0.1.0
    container_name: file-service-container
    ports:
      - 8086:8086
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_FILE_UPLOADED_TOPIC=${KAFKA_FILE_UPLOADED_TOPIC}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL}
      - MINIO_SECURE=${MINIO_SECURE}
    networks:
      - do-an-net
    depends_on:
      service-discovery-container:
        condition: service_healthy
    restart: always

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=techhub987654321
    volumes:
      - minio_data:/data
    ports:
      - 9002:9000
      - 9001:9001
    networks:
      - do-an-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  notification-service-container:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    image: toandeptroai/notification-service:0.1.0
    container_name: notification-service-container
    ports:
      - 8088:8088
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    networks:
      - do-an-net
    depends_on:
      service-discovery-container:
        condition: service_healthy
    restart: always

  ai-service-container:
    build:
      context: ./ai-service-fastapi
      dockerfile: Dockerfile
    image: toandeptroai/ai-service:0.1.0
    container_name: ai-service-container
    ports:
      - 8091:8091
    environment:
      - AI_SERVICE_PORT=8091
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - EUREKA_SERVER_URL=${EUREKA_SERVER_URL:-http://service-discovery-container:8761/eureka/}
      - EUREKA_INSTANCE_HOSTNAME=${EUREKA_INSTANCE_HOSTNAME_AI_SERVICE:-ai-service-container}
      - AI_EUREKA_ENABLED=true
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_CHAT_MODEL=${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      - OPENAI_EMBEDDING_MODEL=text-embedding-3-small
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_CHAT_MODEL=${GEMINI_CHAT_MODEL:-gemini-2.5-flash}
      - GEMINI_EMBEDDING_MODEL=gemini-embedding-001
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - QDRANT_HOST=${QDRANT_HOST}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - QDRANT_RECOMMENDATION_COLLECTION=${QDRANT_RECOMMENDATION_COLLECTION:-course_embeddings}
      - QDRANT_LESSON_COLLECTION=${QDRANT_LESSON_COLLECTION:-lesson_embeddings}
      - QDRANT_PROFILE_COLLECTION=${QDRANT_PROFILE_COLLECTION:-user_embeddings}
      - QDRANT_SESSION_FILE_COLLECTION=session_file_embeddings
      - QDRANT_USER_FILE_COLLECTION=user_file_embeddings
      - FILE_SERVICE_BASE_URL=http://file-service-container:8086
      - AI_ORCHESTRATION_V2_ENABLED=true
      - AI_LEGACY_FALLBACK_ENABLED=true
      - AI_HITL_ENABLED=true
      - AI_KAFKA_ENABLED=true
      - AI_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - AI_KAFKA_TOPICS=course-events,lesson-events,enrollment-events,rating-events,learning-path-events,file-uploaded
      - AI_OCR_ENABLED=true
      - LANGFUSE_ENABLED=true
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL}
    networks:
      - do-an-net
    depends_on:
      service-discovery-container:
        condition: service_healthy
    cpus: "0.50"
    mem_limit: 512m
    mem_reservation: 256m
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8091/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  analytics-service-container:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    image: toandeptroai/analytics-service:0.1.0
    container_name: analytics-service-container
    ports:
      - 8092:8092
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_CONSUMER_AUTO_STARTUP=false
      - PAYMENT_EVENTS_TOPIC=${PAYMENT_EVENTS_TOPIC}
    networks:
      - do-an-net
    depends_on:
      service-discovery-container:
        condition: service_healthy
    restart: always

networks:
  do-an-net:
    name: do-an-network
    external: true

volumes:
  minio_data:

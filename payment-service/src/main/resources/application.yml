server:
  port: 8084

dotenv:
  location: ../.env

spring:
  application:
    name: PAYMENT-SERVICE
  task:
    scheduling:
      enabled: ${SPRING_TASK_SCHEDULING_ENABLED:true}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1200000
      auto-commit: true
      pool-name: PaymentServiceHikariPool
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: com.techhub.app.commonservice.jpa.PostgreSQLEnumDialect
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# PayPal Configuration
paypal:
  mode: ${PAYPAL_MODE:sandbox}
  client-id: ${PAYPAL_CLIENT_ID}
  client-secret: ${PAYPAL_CLIENT_SECRET}
  api-base: ${PAYPAL_API_BASE}
  return-url: ${PAYPAL_RETURN_URL}
  cancel-url: ${PAYPAL_CANCEL_URL}

# VNPay Configuration
vnpay:
  tmn-code: ${VNPAY_TMN_CODE}
  hash-secret: ${VNPAY_HASH_SECRET}
  payment-url: ${VNPAY_PAYMENT_URL}
  return-url: ${VNPAY_RETURN_URL}
  version: ${VNPAY_VERSION}
  command: ${VNPAY_COMMAND}
  order-type: ${VNPAY_ORDER_TYPE}

# Payment Frontend URLs
payment:
  frontend-result-url: ${PAYMENT_FRONTEND_RESULT_URL}
  frontend-vnpay-return-url: ${PAYMENT_FRONTEND_VNPAY_RETURN_URL}
  revenue:
    instructor-rate: ${INSTRUCTOR_REVENUE_RATE:0.7}
  payout:
    paid-deduction-cutoff: ${PAYOUT_PAID_DEDUCTION_CUTOFF:2026-06-05T00:00:00+07:00}
  events:
    topic: ${PAYMENT_EVENTS_TOPIC:payment.revenue.events}
    dispatch-delay-ms: ${OUTBOX_DISPATCH_DELAY_MS:3000}
    max-retry: ${OUTBOX_MAX_RETRY:5}

# Eureka Configuration
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:https://eureka.tonynyan.id.vn/eureka/}
  instance:
    prefer-ip-address: true
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}

# Course Service - sử dụng service name thay vì hardcode URL
course-service:
  name: COURSE-SERVICE  # Service name registered in Eureka

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    tags:
      application: ${spring.application.name}

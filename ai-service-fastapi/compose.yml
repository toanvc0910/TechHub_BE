services:
  ai-service-container:
    build:
      context: .
      dockerfile: Dockerfile
    image: toandeptroai/ai-service:0.1.0
    container_name: ai-service-container
    ports:
      - "8091:8091"
    env_file:
      - .env
    networks:
      - techhub
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8091/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  techhub:
    external: true
